[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "篝火客户端。"

[[bin]]
name = "gouhuo"
path = "src/main.rs"

[dependencies]
client-core.workspace = true
protocol.workspace = true
# 整条语音链路，**带回声消除和降噪**。不需要任何外部工具链 ——
# git clone 完 cargo run 就是完整的。
#
# feature 要显式列：工作区那条关掉了默认值，见根 Cargo.toml 的注释。
voice-core = { workspace = true, features = ["pipeline", "apm"] }
slint = { workspace = true, features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_Graphics_Dwm",
    # 篝火：看前台是不是全屏游戏，是的话火就别烧了（src/main.rs 的 fire_pace）
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # 只开一个实例、把链接转交给已经在跑的那个：见 src/single_instance.rs
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    # 检查更新（src/update.rs）和打开下载页
    "Win32_Networking_WinHttp",
    "Win32_UI_Shell",
] }

[build-dependencies]
slint-build.workspace = true
# 把图标和版本信息编进 exe（Windows 资源）。它负责找到 Windows SDK 的 rc.exe。
embed-resource = "3"

[dev-dependencies]
# 只给 examples/make_icon.rs 用：从 SVG 生成 exe 图标。跟 Slint 自己用的是同一个版本，
# 不多编一份。
resvg = "0.48"
