[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# 自部署层：法务白名单友好，但改动要回流，见 LICENSING.md
license = "MPL-2.0"
description = "篝火服务端：单二进制，自部署零依赖。"

# 拆成 lib + bin：集成测试进不了 bin crate，而认证流程恰恰是最需要
# 端到端测的一块。
[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "gouhuo-server"
path = "src/main.rs"

[features]
default = ["web"]
# 浏览器加入页和给客户端读的发现端点（src/web.rs）。默认带着；
# 运行时还要设 GOUHUO_WEB_LISTEN 才会真的起 —— 不设就一个线程、一个端口都不多。
# 想要一个彻底不含 HTTP 服务的二进制：--no-default-features。
web = ["dep:tiny_http"]

[dependencies]
protocol.workspace = true
transport.workspace = true
# 只用它的身份（Ed25519）。**显式关掉默认 feature** —— 服务端从头到尾
# 不碰音频采样，带上 APM 和 Opus 只是白白多编十几个 crate、多占体积。
voice-core = { workspace = true, default-features = false }
rustls.workspace = true
getrandom.workspace = true
# 频道树的存档，见 src/store.rs
rusqlite.workspace = true
# 控制面等待可读/可写事件，不使用会吞数据的 socket 读超时。
polling = "3"
# 浏览器加入页的 HTTP 服务，只有 web feature 用到。
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
protocol.workspace = true
transport.workspace = true
voice-core = { workspace = true, default-features = false }
rustls.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }
