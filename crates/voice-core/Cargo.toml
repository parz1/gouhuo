[package]
name = "voice-core"
version.workspace = true
edition.workspace = true
# 工作区是 1.80，这里单独抬到 1.91 —— sonora（APM）要这个版本。
# **只抬这一个 crate**：protocol 是给第三方照着实现的，没理由被一个
# 客户端音频依赖拖着升。
rust-version = "1.91"
# 引擎层：要能链进闭源产品，见 LICENSING.md
license = "MPL-2.0"
description = "客户端语音内核：音频 IO / APM / Opus / 抖动缓冲 / 传输 / 热键。M1 只含抖动缓冲、实时时钟与度量。"

[[example]]
name = "quality-probe"
required-features = ["pipeline", "apm"]

[features]
# 默认带上 APM。客户端要它，服务端不要 —— 见下。
default = ["pipeline", "apm"]
# 回声消除 / 降噪 / AGC。
#
# **2026-09 之前这个是默认关着的**，因为当时用的是 C++ 的 libwebrtc APM，
# 要 meson + ninja + 一整套工具链，挡在「git clone 完 cargo build」前面。
# 换成纯 Rust 的 sonora 之后那个理由没了 —— 跑起来就该有回声消除和降噪，
# 而「外放开黑不啸叫」正是这个产品的卖点，不该要用户自己去开。
# 换的过程和 A/B 数字见 docs/apm-backend.md。
#
# 仍然是个 feature，是为了服务端：它只转发 Opus 包，从头到尾不碰音频采样，
# 带上 APM 只是白白多编几个 crate、多占体积。
apm = ["dep:sonora"]
# Opus 编解码。要 cmake（从源码编 libopus），所以也是可选的 ——
# 服务端只转发 Opus 包，从不解码。
codec = ["dep:opus"]
# 整条语音链路。**不强制要 apm** —— 没有 APM 的链路照样能通，
# 只是没有回声消除和降噪。默认那份是带 APM 的，见 `default`。
pipeline = ["codec"]

[dependencies]
voice-types.workspace = true
protocol.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
sha2.workspace = true
opus = { workspace = true, optional = true }
sonora = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# Unix socket 选项；服务端不依赖任何音频后端。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography",
    "Win32_Security",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # 全局热键走 Raw Input，见 src/hotkey.rs
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # WNDCLASSW 里有 HBRUSH/HICON 这些 GDI 类型
    "Win32_Graphics_Gdi",
    # 念名字：WinRT 的 SpeechSynthesizer，见 src/tts.rs
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Networking_WinSock",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
