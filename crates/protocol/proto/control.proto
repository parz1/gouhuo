//
// 控制面的消息定义。客户端和服务端共用这一份，别的语言写第三方客户端也照着这个来。
//
// 为什么是 protobuf 而不是手写：自部署意味着客户端和服务端的版本**一定**会不一致
// （没人会同时升级公会的服务器和自己的客户端）。加字段不能破坏旧端，
// 这正是 protobuf 的演进语义解决的问题。而且这是暴露在公网上的解析器，
// 处理的是不可信输入 —— 手写的攻击面明显高于打磨了二十年的实现。
//
// 演进规矩，破一次就回不去：
//   1. **字段编号永不复用。** 删字段就把编号标进 reserved
//   2. 加字段只能加可选的（proto3 默认就是），旧端会忽略它
//   3. 改字段的类型或含义 = 换一个新编号，不要原地改
//   4. 收到不认识的 oneof 分支 = 忽略，不是错误

syntax = "proto3";

package gouhuo.control.v1;

// ===========================================================================
// 角色
// ===========================================================================

// 预设角色，**刻意不是权限矩阵**。
//
// 「权限是个矩阵没人看得懂」是这个项目要修的痛点之一。所以线上传的是角色，
// 不是一串权限位 —— 服务端自己决定每个角色能干什么，客户端只需要知道
// 「我是什么角色」就能把界面画对。高级模式（真要逐项配权限）是服务端的事，
// 不进协议。
enum Role {
  ROLE_UNSPECIFIED = 0;
  // 能听能说，但不能改任何东西。没有邀请码进来的人默认是这个。
  ROLE_GUEST = 1;
  // 正常成员：能建临时频道、能改自己的东西。
  ROLE_MEMBER = 2;
  // 频道管理：能踢人、能改自己管的频道。
  ROLE_CHANNEL_ADMIN = 3;
  // 服务器管理员。
  ROLE_ADMIN = 4;
}

// ===========================================================================
// 握手与认证
// ===========================================================================

// 客户端连上 TLS 之后的第一条消息。
message Hello {
  // 控制面协议版本。跟客户端版本号是两回事 —— 这个只在协议格式变了才动。
  uint32 protocol_version = 1;
  // 给人看的客户端版本，比如 "gouhuo 0.1.0"。只用来排查问题，不参与任何判断。
  string client_version = 2;
  // Ed25519 公钥，32 字节。这就是用户身份，没有账号密码。
  bytes public_key = 3;
}

// 服务端发回的挑战。客户端要用私钥签它，证明自己真的持有那把私钥。
//
// 必须由服务端出随机数：让客户端自己选要签的内容，等于允许重放。
message Challenge {
  // 至少 32 字节的随机数。
  bytes nonce = 1;
}

// 客户端对挑战的应答。
message Authenticate {
  // 对 Challenge.nonce 的 Ed25519 签名，64 字节。
  bytes signature = 1;
  // 邀请链接里带的邀请码。没有就空着 —— 能不能进由服务端的策略决定。
  string invite_code = 2;
  // 想用的昵称。服务端可能改（重名、敏感词），最终以 Welcome 里的为准。
  string desired_name = 3;
}

// 认证通过。这条消息一口气把客户端开始工作需要的全部状态发过来。
message Welcome {
  // 本次连接的会话 id。语音包头里的 session 就是它。
  uint32 session_id = 1;
  // 服务端最终给的昵称，可能跟 desired_name 不一样。
  string name = 2;
  Role role = 3;
  // 语音用的 UDP 端口。可能跟控制面的 TCP 端口不同。
  uint32 udp_port = 4;
  // 完整的频道树。
  repeated Channel channels = 5;
  // 当前在线的人，含自己。
  repeated User users = 6;
  // 客户端应该待在哪个频道。
  uint32 current_channel_id = 7;
  // Supports authenticated TLS voice; absent on old servers.
  bool tcp_voice = 8;
}

// 认证没过，或者服务端不收。发完就断开。
message Rejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // 协议版本对不上，客户端太旧或太新。
    REASON_VERSION_MISMATCH = 1;
    // 签名验不过 —— 公钥和私钥对不上。
    REASON_BAD_SIGNATURE = 2;
    // 需要邀请码，但没给或者给错了。
    REASON_INVITE_REQUIRED = 3;
    // 这个公钥被封了。
    REASON_BANNED = 4;
    // 服务器满了。
    REASON_FULL = 5;
    // 服务端自己出问题了。
    REASON_INTERNAL = 6;
  }
  Reason reason = 1;
  // 给人看的说明，可以直接显示。
  string detail = 2;
}

// ===========================================================================
// 频道与成员
// ===========================================================================

message Channel {
  uint32 id = 1;
  // 父频道 id。根频道的 parent_id 等于自己的 id。
  uint32 parent_id = 2;
  string name = 3;
  // 频道说明，给人看的。
  string description = 4;
  // 人数上限，0 表示不限。
  uint32 max_users = 5;
  // 进这个频道要的最低角色。
  Role min_role = 6;
  // 建这个频道的人的公钥，32 字节。空 = 服务器自带的频道（根频道），谁都删不掉。
  //
  // **上线是为了让客户端知道「这个频道是不是我建的」** —— 删除的规则是
  // 「建的人自己，或者频道管理及以上」，而 ChannelState 是广播给所有人的
  // 同一份内容，没法按收件人给不同的答案。所以发原始依据，让每个客户端
  // 自己跟自己的公钥比。
  //
  // 这不泄露什么：公钥本来就在 User 里对所有人可见。
  bytes created_by = 7;
}

message User {
  uint32 session_id = 1;
  // Ed25519 公钥，32 字节 —— 跨会话稳定的身份。
  // 昵称会变、会重名，要认人就认这个。
  bytes public_key = 2;
  string name = 3;
  uint32 channel_id = 4;
  Role role = 5;
  // 自己把自己静音了。
  bool self_muted = 6;
  // 自己把自己的耳朵关了（同时也不会说话）。
  bool self_deafened = 7;
  // 被管理员静音了。
  bool server_muted = 8;
}

// 有人进来、改名、换频道、静音状态变了 —— 都用这一条。
//
// 只发变化的字段代价是要区分「没带这个字段」和「带了但是零值」，proto3 做不到。
// 所以这里**每次都发完整状态**：控制面流量很小，省这点带宽不值得换来一类
// 「状态没同步上」的 bug。
message UserState {
  User user = 1;
}

message UserLeft {
  uint32 session_id = 1;
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_DISCONNECTED = 1;
    REASON_KICKED = 2;
    REASON_BANNED = 3;
    // 心跳超时。
    REASON_TIMEOUT = 4;
  }
  Reason reason = 2;
}

// 频道被建/被改/被删。删除时 removed 置位，其余字段无意义。
message ChannelState {
  Channel channel = 1;
  bool removed = 2;
}

// 服务端要主动断开这条连接，先说一声为什么。发完就断开。
//
// 客户端据此判断**该不该自动重连**：网络断了、服务器重启了，连接是「没了」，
// 重连就对；被顶号、被踢、被封，连接是「被拿走了」，重连只会把事情搞坏 ——
// 顶号的两端各自重连，会互相踢个没完。没收到这条就断了的，一律当成网络问题。
message Goodbye {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // 同一个身份从别处又连了进来，这条被顶掉了。
    REASON_DISPLACED = 1;
    REASON_KICKED = 2;
    REASON_BANNED = 3;
  }
  Reason reason = 1;
  // 给人看的说明，可以直接显示。
  string detail = 2;
}

// ===========================================================================
// 操作
// ===========================================================================

message JoinChannel {
  uint32 channel_id = 1;
}

// 建一个频道。
//
// 谁能建由服务端决定（见 Role 的注释：访客不行，成员及以上可以）。
// 建成之后服务端广播一条 ChannelState，**包括发给建的人自己** ——
// 客户端不要本地先插一个再等确认，那样会在被拒绝时留下一个幽灵频道。
message CreateChannel {
  // 挂在哪个频道下面。0 或者服务端不认识的 id 一律挂到根频道。
  uint32 parent_id = 1;
  // 频道名。服务端会去掉首尾空白并限长，空名字直接拒。
  string name = 2;
  string description = 3;
  // 人数上限，0 表示不限。
  uint32 max_users = 4;
  // 进这个频道要的最低角色。
  Role min_role = 5;
}

// 删一个频道。
//
// 根频道删不掉。频道里的人会被挪回根频道，子频道会上提到根频道 ——
// 服务端为这些变动各发一条 UserState / ChannelState。
message DeleteChannel {
  uint32 channel_id = 1;
}

// 文字消息。**刻意只有纯文本，没有富文本。**
//
// 「富文本」在明确不做的清单里：场景是边打游戏边说话，文字是用来发个链接、
// 报个坐标的，不是用来排版的。而富文本会带来一整套解析、渲染和安全问题。
message TextMessage {
  // 发到哪个频道。客户端发出时填目标，服务端转发时保持不变。
  uint32 channel_id = 1;
  // 服务端转发时填上是谁发的；客户端发出时这个字段会被忽略（防冒名）。
  uint32 sender_session_id = 2;
  // 纯文本。服务端会限长。
  string body = 3;
  // 服务端盖的时间戳，Unix 毫秒。客户端填的会被覆盖。
  int64 timestamp_ms = 4;
}

// 改一个频道：改名、改说明、挪到别的父频道下。
//
// 发的是**完整的目标状态**，不是差量：不想改的字段填当前值。跟 UserState
// 同一个理由 —— proto3 分不清「没带这个字段」和「带了但是空」。
//
// 谁能改：建的人自己，或者频道管理及以上。根频道只有管理员能改，而且只能
// 改名和说明，挪不了。不能挪到自己的子孙下面（那会成环）。
// 改成了服务端广播一条 ChannelState 给所有人；没改成什么都不发。
message EditChannel {
  uint32 channel_id = 1;
  string name = 2;
  string description = 3;
  uint32 parent_id = 4;
}

// 把一个人踢出服务器。他可以马上再连回来 —— 要他回不来用 BanUser。
//
// 频道管理及以上能踢，而且只能踢角色比自己低的人。被踢的人先收到
// Goodbye{KICKED}，客户端因此不会自动重连。
message KickUser {
  uint32 session_id = 1;
  // 给被踢的人看的理由，可以空着。
  string reason = 2;
}

// 封禁：踢出去，并且这个公钥以后再也进不来。只有管理员能封，
// 只能封角色比自己低的人。
message BanUser {
  uint32 session_id = 1;
  string reason = 2;
}

// 解封。只有管理员能解。
message Unban {
  bytes public_key = 1;
}

// 改一个在线的人的角色。只有管理员能改，不能改自己的，也不能改别的管理员的。
// 改成了服务端广播一条 UserState；角色按公钥记住，下次进来还是这个角色。
message SetRole {
  uint32 session_id = 1;
  Role role = 2;
}

// 封禁名单里的一条。
message BannedUser {
  bytes public_key = 1;
  // 被封时叫什么。昵称不是身份，这里只是让管理员认得出是谁。
  string name = 2;
  int64 banned_at_ms = 3;
  // 谁封的（当时的昵称）。
  string banned_by = 4;
  string reason = 5;
}

// 完整的封禁名单。**只发给管理员**：登录时发一次，名单一变再发一次。
// 别人不需要知道谁被封了，那不是公开信息。
message BanList {
  repeated BannedUser entries = 1;
}

message SelfState {
  bool self_muted = 1;
  bool self_deafened = 2;
}

// ===========================================================================
// 心跳
// ===========================================================================

// 控制面心跳，顺便测 TCP 往返。
//
// 语音面的 UDP 心跳是另一套：它还负责让服务端知道客户端的 UDP 源地址
// （NAT 后面的地址只有收到包才知道），以及判断 UDP 通不通、要不要退回 TCP。
message Ping {
  // 客户端本地时间戳，服务端原样送回。单位随客户端，只用来算差值。
  int64 timestamp = 1;
  // 到现在为止收到了多少语音包。服务端拿它判断 UDP 通不通。
  uint64 udp_packets_received = 2;
}

message Pong {
  int64 timestamp = 1;
  // 服务端从这个客户端收到了多少 UDP 语音包。跟客户端的计数一对比，
  // 就知道是哪个方向不通。
  uint64 udp_packets_received = 2;
}

// ===========================================================================
// 信封
// ===========================================================================

// 客户端发给服务端的一切。
// Encrypted voice datagram, same header/key/sequence as UDP. Maximum MAX_DATAGRAM.
message VoiceDatagram { bytes datagram = 1; }
// Client requests its bidirectional path; server echoes after applying it.
// UDP keepalives continue on UDP and never change the selected path.
message VoicePath { bool tcp = 1; }

message ClientMessage {
  oneof payload {
    Hello hello = 1;
    Authenticate authenticate = 2;
    Ping ping = 3;
    JoinChannel join_channel = 4;
    TextMessage text_message = 5;
    SelfState self_state = 6;
    CreateChannel create_channel = 7;
    DeleteChannel delete_channel = 8;
    EditChannel edit_channel = 9;
    KickUser kick_user = 10;
    BanUser ban_user = 11;
    Unban unban = 12;
    SetRole set_role = 13;
    VoiceDatagram voice_datagram = 14;
    VoicePath voice_path = 15;
  }
}

// 服务端发给客户端的一切。
message ServerMessage {
  oneof payload {
    Challenge challenge = 1;
    Welcome welcome = 2;
    Rejected rejected = 3;
    Pong pong = 4;
    UserState user_state = 5;
    UserLeft user_left = 6;
    ChannelState channel_state = 7;
    TextMessage text_message = 8;
    Goodbye goodbye = 9;
    BanList ban_list = 10;
    VoiceDatagram voice_datagram = 11;
    VoicePath voice_path = 12;
  }
}
