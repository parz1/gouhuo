[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# 这一个 crate 不跟工作区：协议定义要能被任何人自由实现，
# 包括闭源的第三方客户端和别的语言的实现。理由见 LICENSING.md。
license = "MIT OR Apache-2.0"
description = "客户端与服务端共享的唯一一份协议定义：包格式、序列化、加密。"

[features]
default = ["crypto"]
crypto = ["dep:chacha20poly1305"]
connection-serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
chacha20poly1305 = { workspace = true, optional = true }
# 证书指纹和邀请码校验和要用。RustCrypto 的纯 Rust 实现，无外部依赖 ——
# 这个 crate 要能被任何人照着实现，依赖越少越好。
sha2.workspace = true
prost.workspace = true

[build-dependencies]
prost-build.workspace = true
protox.workspace = true
