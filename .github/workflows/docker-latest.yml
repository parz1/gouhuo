name: docker-latest

# 在网页上点「发布」那一刻，把 gouhuo-server:latest 指到这个版本。
#
# 镜像本身在 release.yml 里推标签时就编好了，这里只是改个指向，不重新编 ——
# 服务器上 `docker compose pull` 拿到的跟草稿阶段验过的是同一份字节。
on:
  release:
    types: [published]

permissions:
  packages: write

jobs:
  latest:
    # 预发布版不挪 latest，想试的人自己写死版本号。
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: latest -> ${{ github.event.release.tag_name }}
        run: |
          image=ghcr.io/${{ github.repository_owner }}/gouhuo-server
          version="${{ github.event.release.tag_name }}"
          docker buildx imagetools create -t "$image:latest" "$image:${version#v}"
