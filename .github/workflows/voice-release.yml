name: voice-release

on:
  push:
    tags: ["voice-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing voice-v* tag to build with this workflow
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  VOICE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:VOICE_TAG -notmatch '^voice-v\d+\.\d+\.\d+$') { throw 'Invalid voice release tag' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VOICE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate independent version
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/voice-engine/Cargo.toml -Pattern '^version = "([^"]+)"$').Matches[0].Groups[1].Value
          if ($env:VOICE_TAG -ne "voice-v$version") { throw 'Voice tag/version mismatch' }
          "VOICE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Test process host
        run: cargo test --locked -p voice-engine --test process
      - name: Build independent engine
        run: cargo build --locked --profile dist -p voice-engine --bin gouhuo-voice
      - name: Sign manifest and executable checksum
        shell: pwsh
        env:
          GOUHUO_VOICE_SIGNING_KEY: ${{ secrets.GOUHUO_VOICE_SIGNING_KEY }}
          GOUHUO_VOICE_PUBLIC_KEY: ${{ vars.GOUHUO_VOICE_PUBLIC_KEY }}
        run: |
          cargo run --locked -p client-process --bin gouhuo-voice-release -- sign target/dist/gouhuo-voice.exe $env:VOICE_VERSION 0.3.2 target/voice-release
          if ($LASTEXITCODE -ne 0) { throw 'Voice release signing failed' }
      - name: Create independent draft without replacing latest UI release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:VOICE_TAG" --draft --verify-tag --latest=false --title "声音内核 $env:VOICE_VERSION" --notes '独立声音内核。先验证签名与兼容性，再在安全空闲点激活。' target/voice-release/*
          if ($LASTEXITCODE -ne 0) { throw 'Voice draft release failed' }
