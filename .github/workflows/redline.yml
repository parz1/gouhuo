name: redline

on:
  # **不在 push 上跑。** public 仓库的标准 runner 是不计费的（GitHub 文档：
  # "free ... for public repositories that use standard GitHub-hosted runners"），
  # 所以这不是为了省钱 —— 是为了别让一个单人项目每次 push 都等 8 分钟、
  # 烧一台 Windows VM。
  #
  # 想验的时候手动跑：gh workflow run redline
  # 真正需要它的时候（准备发版、改完一个里程碑、动了跨平台的东西）跑一次就够。
  pull_request:
  workflow_dispatch:

# 同一个 PR 再推一次，就把上一轮还没跑完的取消掉 —— 旧提交的结果没人会看。
concurrency:
  group: redline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # VS 自带的 cmake 是 4.x，libopus 的 CMakeLists 声明的最低版本太老会被直接拒。
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # DCO：每个提交都要有 Signed-off-by。
  #
  # 只查 PR 里的提交，不查历史 —— 这个检查是从引入 DCO 那天起生效的，
  # 拿它去追溯以前的提交只会让每个 PR 都红。
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查 Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "缺 Signed-off-by: $sha $(git show -s --format=%s "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "提交时加 -s 就会自动带上，补救：git rebase --signoff $base"
            echo "说明见 CONTRIBUTING.md"
            exit 1
          fi
          echo "所有提交都签了。"

  # 许可边界：每个 .rs 文件头的 SPDX 要跟所属 crate 的 license 字段一致。
  #
  # 仓库是混合许可的（protocol 宽松 / 引擎和服务端 MPL / 客户端 GPL），而 MPL 是
  # **文件级** copyleft —— 边界就是靠每个文件头那行划的。一个标着 GPL 的文件躺在
  # MPL 的 crate 里，不是不整洁，是边界真的模糊了。
  #
  # 这事会自己复发：新文件基本都是照抄同目录的旧文件。服务端改 MPL 那次就抓到
  # 一个（wasapi/live.rs 是前一个 commit 新增的，头还写着 GPL）。靠人眼盯不住。
  #
  # 不跟 deterministic 合并，因为它完全不需要编译 —— 独立跑在 ubuntu 上几秒出结果。
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查 SPDX 头
        run: python3 scripts/check-spdx.py

  # 确定性的红线：编译、单元测试、带宽和编解码成本。
  # 这些不依赖调度精度，在共享 runner 上也是可信的，所以**门禁在这里**。
  #
  # 等 dco 和 license 过了才跑：那两个几秒出结果，这个要编整个工作区好几分钟，
  # 前面已经红了就没必要再烧一台 Windows VM。手动触发时 dco 是 skipped，
  # skipped 不算失败，所以用 !failure() 而不是默认的「全部 success」。
  deterministic:
    needs: [dco, license]
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # APM 曾经要 meson + ninja + libclang + MSVC 环境注入，还要一个极短的
      # CARGO_TARGET_DIR 绕 MAX_PATH —— 因为它要从源码编 libwebrtc。
      # 换成纯 Rust 的 sonora 之后这一整段都没了，见 docs/apm-backend.md。
      # 现在唯一的原生依赖是 libopus，而 cmake 在 windows runner 上本来就有。

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # 延迟数字**不在这里测**。
  #
  # 曾经有个 latency-record job 每次跑 4m42s，把 m1.json 存成 artifact 用来看趋势。
  # 砍掉了：它不卡任何东西，而那些 artifact 从建立到删除没有人看过一次。
  # 「以后可能有用」不值得每次 CI 多烧五分钟。
  #
  # 要数字就本地跑，那儿的数还更可信（见下面 gate 的注释）：
  #   cargo run --release -p latency-probe -- --seconds 4

  # 真门禁。只在专用 Windows 机器上跑 —— 独占、不虚拟化、跑的时候不干别的。
  #
  # 要启用：挂一个带 `dedicated-audio` 标签的 self-hosted runner，
  # 并把仓库变量 DEDICATED_RUNNER 设成 true。
  gate:
    if: vars.DEDICATED_RUNNER == 'true'
    runs-on: [self-hosted, windows, dedicated-audio]
    steps:
      - uses: actions/checkout@v4
      - name: 协议链路的防回归闸
        # 判据：city 档里**存在**一个音质过关、协议延迟在闸以内的配置。
        # 闸的数字来自 redline::GATE_PROTOCOL_MS，不在这里重复写 ——
        # 两处各写一份迟早会漂移，而漂移的那天 CI 是绿的。
        #
        # 只卡协议这一段：设备那段由声卡和驱动决定，APM 那段由上游的 APM
        # 实现决定，这两段变了不是我们改坏了。协议段一旦变慢，一定是我们干的。
        run: cargo run --release -p latency-probe -- --seconds 30 --assert-gate
