[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/transport",
    "crates/voice-core",
    "crates/latency-probe",
    "crates/device-probe",
    "crates/server",
    "crates/client-core",
    "crates/client",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
# 工作区默认是 GPL；引擎层（voice-core / transport）单独放宽为 MPL-2.0，
# protocol 是 MIT/Apache —— 每个 crate 自己声明，见 LICENSING.md。
license = "GPL-3.0-or-later"

[workspace.dependencies]
protocol = { path = "crates/protocol" }
# **工作区这条关掉默认 feature，每个成员自己显式列要什么。**
#
# 不是风格选择，是 cargo 的规矩：workspace.dependencies 里的 default-features
# 说了算 —— 这里不写的话，成员写 `default-features = false` 会被**静默忽略**
# （cargo 只给一句警告），服务端就白白背上整条音频链路。
#
# 代价是成员得把 feature 抄一遍，漏了就编译失败。而且
# `cargo check --workspace` 因为 feature 统一**看不出来**漏没漏 ——
# 只有单独 `cargo check -p client` 才炸。改这里之后记得单独 check 一遍。
#
# voice-core 自己的 `default` 仍然有意义：它是 MPL 的引擎，给工作区外面
# 的人用的时候，默认就该是完整的一份。
voice-core = { path = "crates/voice-core", default-features = false }
opus = "0.3"
chacha20poly1305 = "0.10"
windows-sys = "0.59"
sha2 = { version = "0.10", default-features = false }
# 身份用的 Ed25519。zeroize 让私钥在 Drop 时自动擦掉。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
getrandom = "0.3"
# 控制面消息。protox 是纯 Rust 的 .proto 编译器 —— 不需要贡献者先装 protoc。
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
# TLS。选 ring 而不是 aws-lc-rs：ring 在 Windows/MSVC 上纯 cargo build 就能编，
# aws-lc-rs 要 cmake 和 nasm。见 crates/transport/src/lib.rs 的注释。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.14"
transport = { path = "crates/transport" }
client-core = { path = "crates/client-core" }
# 界面。选 Slint 不选 Tauri：不带 WebView2，安装包和内存都由我们自己说了算 ——
# 安装包 60 MB、voice-core RSS 100 MB 这两条红线完全由界面框架决定。
slint = "1"
slint-build = "1" 
# WASAPI 要走 COM 接口，windows-sys 只有裸 FFI，接不了 IMMDeviceEnumerator/IAudioClient。
windows = "0.62"
# APM（AEC3 / 降噪 / AGC）。libwebrtc AudioProcessing 模块（M145）的纯 Rust 移植。
#
# 一直到 2026-09 用的是 C++ 的 webrtc-audio-processing，它在 Windows/MSVC 上
# 开箱编不过 —— 七个补丁、5.3 MB vendor 源码、一个环境准备脚本，而且 APM
# 因此默认关着。sonora 不需要任何 C++ 工具链，所以 APM 现在是默认开的。
# 换之前的 A/B 和它的局限见 docs/apm-backend.md。
sonora = "0.2"
# 服务端的存档。bundled = SQLite 源码编进二进制，自部署的人不用装任何东西。
rusqlite = { version = "0.40", features = ["bundled"] }

# M1 只关心延迟数字，所以 release 必须是真 release。
# 注意：不开 panic = "abort"，否则 cargo test --release 跑不了。
# 体积相关的开关（panic=abort / strip）等到打客户端安装包时在 bin 的 profile 里加。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

# 打包用的 profile。release 带着 debug = 1（量延迟时要看栈），发布不需要。
#
# panic = "abort" 只放在这里：release 上开了的话 `cargo test --release` 就跑不了，
# 而那正是量延迟数字用的构建。
#
# 安装包 60 MB 是红线，所以这个 profile 的产物大小是要盯着的数字。
[profile.dist]
inherits = "release"
strip = "symbols"
panic = "abort"
