# 服务器上只需要这一个文件，加一个同目录的 .env：
#
#   GOUHUO_HOST=1.2.3.4        （有域名就写域名，换 IP 时旧邀请链接不会作废）
#
# 别的设置也都写在 .env 里，见下面 env_file 的注释。
#
# 起服务 / 升级到最新版都是同一句：
#
#   docker compose pull && docker compose up -d
#
# 想钉在某个版本上，在 .env 里加 GOUHUO_VERSION=0.1.0。
services:
  gouhuo:
    image: ghcr.io/parz1/gouhuo-server:${GOUHUO_VERSION:-latest}
    # 在仓库里 `docker compose up -d --build` 就是从源码编，不拉镜像。
    build: .
    restart: unless-stopped
    # host 网络：UDP 的对端地址是从收到的包里学的，少一层 Docker NAT 就少一处
    # 改写源地址的可能。只在 Linux 上有效 —— Docker Desktop 上换成下面的 ports。
    network_mode: host
    # ports:
    #   - "20800:20800/tcp"
    #   - "20800:20800/udp"
    # 服务端自己不处理 SIGTERM；没有 init 的话 docker stop 要干等 10 秒再强杀。
    init: true
    # 配置全在 .env 里，**这个文件不用改** —— 改了下次重新下载就被盖掉。
    # .env 里写的 GOUHUO_* 都会原样传进去，比如：
    #
    #   GOUHUO_PORT=20900        换端口（host 网络，防火墙放行新端口的 TCP 和 UDP）
    #   GOUHUO_MAX_USERS=50
    #   GOUHUO_INVITE=           空着 = 不要邀请码
    env_file: .env
    environment:
      # 写进邀请链接的地址：公网 IP 或域名。容器里自动探测只能探到内网 IP，必须手动设。
      GOUHUO_HOST: ${GOUHUO_HOST:?在 .env 里写 GOUHUO_HOST=服务器公网 IP 或域名}
      # 钉死：数据卷挂在这儿，.env 里改了它数据就不在卷里了，重建容器全丢。
      GOUHUO_DATA: /data
    volumes:
      - gouhuo-data:/data

volumes:
  # 写死名字，不随所在目录变 —— 备份命令、文档里才能写同一个名字。
  gouhuo-data:
    name: gouhuo-data
